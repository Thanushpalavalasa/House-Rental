<!-- public/owner/add-listing.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New House Listing | House Rental</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .message { padding: 1rem; margin-top: 1rem; border-radius: 5px; text-align: center; display: none; }
        .message.success { background-color: #d4edda; color: #155724; display: block; }
        .message.error { background-color: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">HouseRental</a>
        <div class="nav-links"><a href="/dashboard.html">Dashboard</a></div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Add Your Property Details</h2>
            <p style="text-align: center; margin-bottom: 2rem; color: #6c757d;">
                Fill out the form below to list your property for rent.
            </p>

            <form id="add-listing-form">
                <div class="form-group">
                    <label for="address">Full Address</label>
                    <input type="text" id="address" name="address" placeholder="e.g., 123 Main St" required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="e.g., Springfield" required>
                </div>
                <div class="form-group">
                    <label for="bedrooms">Number of Bedrooms</label>
                    <input type="number" id="bedrooms" name="bedrooms" min="1" placeholder="e.g., 3" required>
                </div>
                <div class="form-group">
                    <label for="rentAmount">Monthly Rent ($)</label>
                    <input type="number" id="rentAmount" name="rentAmount" min="0" placeholder="e.g., 1500" required>
                </div>
                
                <!-- =================================== -->
                <!--           NEW FORM FIELD            -->
                <!-- =================================== -->
                <div class="form-group">
                    <label for="phoneNumber">Contact Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g., (123) 456-7890" required>
                </div>
                <!-- =================================== -->

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" name="description" rows="4" placeholder="e.g., A spacious house with a large backyard..."></textarea>
                </div>
                <button type="submit" class="btn">Add Listing</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="/js/owner.js" defer></script>
</body>
</html>
